<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Game Task Manager</title>

    <style>
        .task-text {
            display: inline-block;
            width: 200px;
        }
    </style>	
</head>
<body>

    <h1>ゲーム開発タスク管理</h1>

    <input type="text" id="taskInput">
    <button id="addButton">追加</button>
	<br>
	チェック：
	<select id="completedFilter">
		<option value="">すべて</option>
		<option value="false">未完了</option>
		<option value="true">完了</option>
	</select>
	<br>
	ステータス：
	<select id="statusSelect">
		<option value="">すべて</option>
		<option>未着手</option>
		<option>作業中</option>
		<option>レビュー中</option>
		<option>完了</option>
	</select>
	<br>
    <input type="text" id="searchInput">
	<button id="searchButton">検索</button>
	<br>
	<button id="sortButton">優先度順</button>


    <ul id="taskList"></ul>

	<script>
		//初期オブジェクト宣言、入力テキスト、追加ボタン、リスト
	    const input = document.getElementById("taskInput");
	    const button = document.getElementById("addButton");
	    const list = document.getElementById("taskList");
		//配列の作成、localstorageにリストあるなら読み込み
		const tasks = JSON.parse(localStorage.getItem("tasks")) || [];

		const sortButton = document.getElementById("sortButton");
	    const searchInput = document.getElementById("searchInput");
		const searchButton = document.getElementById("searchButton");
	    const statusInput = document.getElementById("statusSelect");
	    const completedFilter = document.getElementById("completedFilter");

		//1つのタスクを画面に表示する関数
		function addTaskToScreen(taskData) {
			//list形式のitemを作成
	        const item = document.createElement("li");

			//tasktextの作成
			const taskText = document.createElement("span");
			taskText.textContent = taskData.text;
			taskText.className = "task-text";
		
			//checkboxの作成
			const checkBox = document.createElement("input");
			checkBox.type = "checkbox";

			//checkboxの状態初期化
			checkBox.checked = taskData.completed;

			//checkboxの状態によりテキストの表示を変える関数
			function updateTaskDisplay() {
				if (checkBox.checked) {
					taskText.style.textDecoration = "line-through";
				} else {
					taskText.style.textDecoration = "none";
				}
			}

			//初期checkboxの状態をテキストに反映
			updateTaskDisplay();

			//checkboxの挙動
			checkBox.addEventListener("change", function() {
				//taskdataの更新
				taskData.completed = checkBox.checked;

				//checkboxの状態をテキストにも反映
				updateTaskDisplay();

				//localstorage更新
				localStorage.setItem("tasks", JSON.stringify(tasks));
			});
		
			//deletebuttonの作成
	        const deleteButton = document.createElement("button");
			deleteButton.textContent = "削除";

			//deletebuttonの挙動
			deleteButton.addEventListener("click", function() {
				//indexの取得
				const index = tasks.indexOf(taskData);
				
				//indexあればtasksから削除
				if (index !== -1) {
					tasks.splice(index, 1);
				}
				
				//tasksの状態をlocalstorageに保存
				localStorage.setItem("tasks", JSON.stringify(tasks));
				
				//表示からも削除
				item.remove();
			});

			/*priority*/
			//priorityの作成
			const prioritySelect = document.createElement("select");

			//optionの作成
			const highOption = document.createElement("option");
			highOption.value = 3;
			highOption.textContent = "高";

			const middleOption = document.createElement("option");
			middleOption.value = 2;
			middleOption.textContent = "中";

			const lowOption = document.createElement("option");
			lowOption.value = 1;
			lowOption.textContent = "低";

			//priorityselectにoptionの追加
			prioritySelect.appendChild(highOption);
			prioritySelect.appendChild(middleOption);
			prioritySelect.appendChild(lowOption);

			//taskdataのpriorityをpriorityselectに入れる
			prioritySelect.value = taskData.priority;
			prioritySelect.addEventListener("change", function() {
				taskData.priority = prioritySelect.value;

				localStorage.setItem("tasks", JSON.stringify(tasks));
			});

			//editbuttonの作成
	        const editButton = document.createElement("button");
			editButton.textContent = "編集";

			// 編集完了の状態変化
			let editInput;
			editButton.addEventListener("click", function() {

				// 編集処理
				if(editButton.textContent === "編集"){
					editInput = document.createElement("input");
					editInput.className = "task-text";
					editInput.type = "text";
					editInput.value = taskData.text;

					taskText.replaceWith(editInput);					

					editButton.textContent = "完了";

				} else {
					taskText.textContent = editInput.value;

					editInput.replaceWith(taskText);					

					editButton.textContent = "編集";

					taskData.text = taskText.textContent;
					localStorage.setItem("tasks", JSON.stringify(tasks));
				}
			}); 

			/*status*/
			//statusの作成
			const statusSelect = document.createElement("select");

			//optionの作成
			const completedOption = document.createElement("option");
			completedOption.value = "完了";
			completedOption.textContent = "完了";

			const reviewOption = document.createElement("option");
			reviewOption.value = "レビュー中";
			reviewOption.textContent = "レビュー中";

			const inProgressOption = document.createElement("option");
			inProgressOption.value = "作業中";
			inProgressOption.textContent = "作業中";

			const notStartedOption = document.createElement("option");
			notStartedOption.value = "未着手";
			notStartedOption.textContent = "未着手";

			//statusselectにoptionの追加
			statusSelect.appendChild(notStartedOption);
			statusSelect.appendChild(inProgressOption);
			statusSelect.appendChild(reviewOption);
			statusSelect.appendChild(completedOption);

			//taskdataのstatusをstatusselectに入れる
			statusSelect.value = taskData.status;
			statusSelect.addEventListener("change", function() {
				taskData.status = statusSelect.value;

				localStorage.setItem("tasks", JSON.stringify(tasks));
			});

			//各パーツをitemに追加
			item.appendChild(checkBox);
			item.appendChild(prioritySelect);
			item.appendChild(statusSelect);
			item.appendChild(taskText);
//			taskText.style.marginRight = "100px";
			item.appendChild(editButton);
			editButton.style.marginRight = "20px";
			item.appendChild(deleteButton);
			
			//itemをlistに追加
	        list.appendChild(item);
		
		}

		//描画のし直し、条件付き（condition）
		function renderTasks(condition){
			list.innerHTML = "";

			tasks.forEach(function(task) {
				if(condition(task)){
					// 描画
					addTaskToScreen(task);
				}
			});

		}

		// Enterキーを押したときの処理
		input.addEventListener("keydown", function(event) {
			if (event.key === "Enter") {
				button.click();
			}
		});

		//addbuttonを押したときの処理
	    button.addEventListener("click", function() {
			//taskで文字の受け取り
	        const task = input.value;

			//空の場合戻る
	        if (task === "") {
	            return;
	        }

			//taskDataの作成
			const taskData = {
				text: task,
				completed: false,
				priority: 1,
				status: "未着手"
			};

			//配列への追加
			tasks.push(taskData);
			
			//localstorageへの保存
			localStorage.setItem("tasks", JSON.stringify(tasks));
			
			//taskDataを表示する関数
			addTaskToScreen(taskData);
			
			//入力欄の初期化
	        input.value = "";
	    });
	    
	    //保存されたリストの読み込み
		tasks.forEach(function(task) {
			addTaskToScreen(task);
		});

		/*優先順位並び替え*/
		sortButton.addEventListener("click", function() {
			//データを並び直す処理
			tasks.sort(function(a, b) {
				return b.priority - a.priority;
			});
			localStorage.setItem("tasks", JSON.stringify(tasks));

			// 画面を一旦空にする
			list.innerHTML = "";			

			// 画面を並び直す処理
			tasks.forEach(function(task) {
				addTaskToScreen(task);
			});
		});

		//searchbuttonを押したときの処理
	    searchButton.addEventListener("click", function() {
/*
			// 画面を一旦空にする
			list.innerHTML = "";

			tasks.forEach(function(task) {
				if(task.text.includes(searchInput.value)
				 && ((statusInput.value === "" || task.status === statusInput.value)
				 && (task.completed === (completedFilter.value === "true") || completedFilter.value === ""))){
					// 描画
					addTaskToScreen(task);
				}
			});
*/

			renderTasks(function(task){
				return task.text.includes(searchInput.value)
				 && ((statusInput.value === "" || task.status === statusInput.value)
				 && (task.completed === (completedFilter.value === "true") || completedFilter.value === ""));
			});



	    });

		//statusSelect変更時動作
	    statusInput.addEventListener("change", function() {
/*
			// 画面を一旦空にする
			list.innerHTML = "";

			tasks.forEach(function(task) {
				if((statusInput.value === "" || task.status === statusInput.value)
				 && (task.completed === (completedFilter.value === "true") || completedFilter.value === "")){
					// 描画
					addTaskToScreen(task);
				}
			});
*/
			renderTasks(function(task){
				return (statusInput.value === "" || task.status === statusInput.value)
				 && (task.completed === (completedFilter.value === "true") || completedFilter.value === "");
			});
	    });

		//completedFilter変更時動作
	    completedFilter.addEventListener("change", function() {
/*
			// 画面を一旦空にする
			list.innerHTML = "";

			tasks.forEach(function(task) {
				if((statusInput.value === "" || task.status === statusInput.value)
				 && (task.completed === (completedFilter.value === "true") || completedFilter.value === "")){
					// 描画
					addTaskToScreen(task);
				}
			});
*/

			renderTasks(function(task){
				return (statusInput.value === "" || task.status === statusInput.value)
				 && (task.completed === (completedFilter.value === "true") || completedFilter.value === "");
			});


	    });



	</script>

</body>
</html>
