<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Game Task Manager</title>
</head>
<body>

    <h1>ゲーム開発タスク管理</h1>

    <input type="text" id="taskInput">
    <button id="addButton">追加</button>


    <ul id="taskList"></ul>

	<script>
		//初期オブジェクト宣言、入力テキスト、追加ボタン、リスト
	    const input = document.getElementById("taskInput");
	    const button = document.getElementById("addButton");
	    const list = document.getElementById("taskList");
		//配列の作成、localstorageにリストあるなら読み込み
		const tasks = JSON.parse(localStorage.getItem("tasks")) || [];

		//itemにtaskを追加する関数
		function addTaskToScreen(taskData) {
			//list形式のitemを作成
	        const item = document.createElement("li");

			//tasktextの作成
			const taskText = document.createElement("span");
			taskText.textContent = taskData.text;
		
			//checkboxの作成
			const checkBox = document.createElement("input");
			checkBox.type = "checkbox";
			//checkboxの状態初期化
			checkBox.checked = taskData.completed;
			if (checkBox.checked) {
			        taskText.style.textDecoration = "line-through";
			}

			//checkboxの挙動
			checkBox.addEventListener("change", function() {
				//taskdataの更新
				taskData.completed = checkBox.checked;

			    if (checkBox.checked) {
			        taskText.style.textDecoration = "line-through";
			    } else {
			        taskText.style.textDecoration = "none";
			    }

				//localstorage更新
				localStorage.setItem("tasks", JSON.stringify(tasks));
			});
		
			//deletebuttonの作成
	        const deleteButton = document.createElement("button");
			deleteButton.textContent = "削除";

			//deletebuttonの挙動
			deleteButton.addEventListener("click", function() {
				//indexの取得
				const index = tasks.indexOf(taskData);
				
				//indexあればtasksから削除
				if (index !== -1) {
					tasks.splice(index, 1);
				}
				
				//tasksの状態をlocalstorageに保存
				localStorage.setItem("tasks", JSON.stringify(tasks));
				
				//表示からも削除
				item.remove();
			});


			//checkbox、tasktext、deletebuttonをitemに追加
			item.appendChild(checkBox);
			item.appendChild(taskText);
			item.appendChild(deleteButton);
			
			//itemをlistに追加
	        list.appendChild(item);

		
		}


		//addbuttonを押したときの処理
	    button.addEventListener("click", function() {
			//taskで文字の受け取り
	        const task = input.value;

			//空の場合戻る
	        if (task === "") {
	            return;
	        }

			//taskDataの作成
			const taskData = {
				text: task,
				completed: false
			};

			//配列への追加
			tasks.push(taskData);
			
			//localstorageへの保存
			localStorage.setItem("tasks", JSON.stringify(tasks));
			
			//itemにtaskを追加する関数
			addTaskToScreen(taskData);
			
			//入力欄の初期化
	        input.value = "";
	    });
	    
	    //保存されたリストの読み込み
		tasks.forEach(function(task) {
			addTaskToScreen(task);
		});
		

	</script>

</body>
</html>
